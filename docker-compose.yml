services:
  db:
    image: postgres:15-alpine
    container_name: matrix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-matrix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-matrix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build: .
    container_name: backend-1
    hostname: backend-1
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      INSTANCE_HOSTNAME: backend-1
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app

  backend-2:
    build: .
    container_name: backend-2
    hostname: backend-2
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      INSTANCE_HOSTNAME: backend-2
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app

  celery_worker_1:
    build: .
    container_name: celery_worker_1
    hostname: celery_worker_1
    restart: unless-stopped
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 -n worker1@%h
    volumes:
      - .:/app

  celery_worker_2:
    build: .
    container_name: celery_worker_2
    hostname: celery_worker_2
    restart: unless-stopped
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 -n worker2@%h
    volumes:
      - .:/app

  autoscaler:
    build: .
    container_name: matrix_autoscaler
    restart: unless-stopped
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      python -m app.worker.autoscaler_runner
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    build: ./nginx
    container_name: matrix_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-1
      - backend-2

volumes:
  postgres_data:
